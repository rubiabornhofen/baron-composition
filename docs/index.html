        const isMobileDevice = () => /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        const exportScreenshot = (canvas, filename, title, text, setIsSnapping) => {
            canvas.toBlob(async (blob) => {
                if (!blob) { setIsSnapping(false); return; }

                const tryCopy = async () => {
                    try {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        return true;
                    } catch (e) {
                        return false;
                    }
                };

                const forceDownload = () => {
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL("image/png");
                    link.download = filename;
                    link.click();
                };

                if (isMobileDevice() && navigator.share && navigator.canShare) {
                    const file = new File([blob], filename, { type: "image/png" });
                    if (navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({ files: [file], title, text });
                            setIsSnapping('done');
                            setTimeout(() => setIsSnapping(false), 2000);
                            return;
                        } catch (e) {
                            if (e.name !== 'AbortError') {
                                const copied = await tryCopy();
                                if (!copied) forceDownload();
                            }
                            setIsSnapping(false);
                            return;
                        }
                    }
                }

                const copied = await tryCopy();
                if (copied) {
                    setIsSnapping('done');
                } else {
                    forceDownload();
                    setIsSnapping('done');
                }
                setTimeout(() => setIsSnapping(false), 2000);
            });
        };

                if (spaceSplit.length === 3) {
                    numbers = spaceSplit.map(Number);
                } else if (cleanLine.length === 3 && !isNaN(cleanLine)) {
                    numbers = cleanLine.split('').map(Number);
                } else {
                    return null;
                }
                const [inf, rng, cav] = numbers;
                const totalParts = inf + rng + cav;
                if (totalParts === 0) return null;
                return {

                            <thead className="bg-[#0f172a] text-slate-400 uppercase text-[10px] sm:text-xs font-bold tracking-wider">
                                <tr>
                                    <th className="px-3 sm:px-4 py-3 border-b border-slate-700">Building</th>
                                    <th className="px-3 sm:px-4 py-3 border-b border-slate-700 text-right">Cost</th>
                                    <th className="hidden sm:table-cell px-4 py-3 border-b border-slate-700">Prereq</th>
                                    <th className="px-3 sm:px-4 py-3 border-b border-slate-700 text-right">Manasteel</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-700/50 bg-[#1e293b]">
                                {tableData.map((row, idx) => (
                                    <tr key={idx} className="hover:bg-slate-800/30 transition-colors">
                                        <td className="px-3 sm:px-4 py-2.5">
                                            <div className="font-medium whitespace-normal text-indigo-300 text-xs sm:text-sm">{row.name}</div>
                                            <div className="block sm:hidden text-[10px] text-slate-500 mt-0.5 whitespace-normal">Req: {row.prereq}</div>
                                        </td>
                                        <td className="px-3 sm:px-4 py-2.5 font-mono text-right text-xs sm:text-sm">{row.cost}</td>
                                        <td className="hidden sm:table-cell px-4 py-2.5 text-xs text-slate-400">{row.prereq}</td>
                                        <td className="px-3 sm:px-4 py-2.5 font-mono text-right text-blue-400 text-xs sm:text-sm">{row.manasteel}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )
        };

        const ManaTroopsView = ({ lvl, lang, captureRef }) => {
            const troopData = useMemo(() => {
                const troopKeys = ['Infantry', 'Range', 'Cavalry'];
                return MANA_BUILDINGS
                    .filter(bldg => troopKeys.includes(bldg.names.en))
                    .map(bldg => {
                        const lIdx = lvl - 1;
                        return {
                            name: bldg.names[lang],
                            cost: bldg.costs[lIdx],
                            manasteel: lvl === 6 ? bldg.manasteel : '0',
                            type: bldg.names.en
                        };
                    });
            }, [lvl, lang]);

            const getColors = (type) => {
                switch(type) {
                    case 'Infantry': return 'border-red-500/30 bg-red-500/10 text-red-400';
                    case 'Range': return 'border-green-500/30 bg-green-500/10 text-green-400';
                    case 'Cavalry': return 'border-blue-500/30 bg-blue-500/10 text-blue-400';
                    default: return 'border-slate-700 bg-[#1e293b] text-slate-200';
                }
            };

            return (
                <div className="p-4 sm:p-6 w-full">
                    <div ref={captureRef} className="max-w-xl mx-auto space-y-3 bg-[#0f172a] p-2 rounded-xl">
                        {troopData.map((troop, idx) => (
                            <div key={idx} className={`p-4 sm:p-5 rounded-xl border flex items-center justify-between transition-colors ${getColors(troop.type)}`}>
                                <span className="font-bold text-lg">{troop.name}</span>
                                <div className="flex items-center gap-6 sm:gap-10 text-right">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] uppercase font-bold opacity-70">Mana</span>
                                        <span className="font-mono font-bold text-base sm:text-lg">{troop.cost}</span>
                                    </div>
                                    <div className="flex flex-col">
                                        <span className="text-[10px] uppercase font-bold opacity-70">Manasteel</span>
                                        <span className="font-mono font-bold text-base sm:text-lg">{troop.manasteel}</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ManaStoreView = ({ captureRef }) => (
            <div className="p-4 sm:p-6 w-full">
                <div ref={captureRef} className="max-w-2xl mx-auto bg-[#0f172a] p-2 rounded-xl">
                    <div className="flex items-center gap-2 mb-6">
                        <ShoppingCart className="text-indigo-400" size={24} />
                        <h2 className="text-xl font-bold text-slate-200">Mana Packages</h2>
                    </div>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {STORE_PACKS.map(pack => (
                            <div key={pack.id} className={`p-4 rounded-xl border flex flex-col ${pack.isSpecial ? 'bg-indigo-900/20 border-indigo-500/50' : 'bg-[#1e293b] border-slate-700'}`}>
                                <div className="flex justify-between items-center mb-4">
                                    <span className="font-bold text-slate-200 flex items-center gap-2 text-sm sm:text-base">
                                        <span className="w-2 h-2 rounded-full bg-cyan-400 inline-block"></span>
                                        {pack.title}
                                    </span>
                                    {pack.isSpecial && <span className="text-[10px] uppercase font-bold px-2 py-0.5 bg-indigo-500 text-white rounded">Special</span>}
                                </div>
                                
                                <div className="mt-auto flex items-center justify-between bg-[#0f172a] p-3 rounded-lg border border-slate-700/50">
                                    <p className="text-slate-400 text-sm">Contains:</p>
                                    <div className="flex items-center gap-1.5 text-blue-400">
                                        <Zap size={18} className="text-blue-400" />
                                        <span className="font-bold text-xl">{pack.mana}</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const ManaEventsView = ({ lang, captureRef }) => (
             <div className="p-4 sm:p-6 w-full">
                <div ref={captureRef} className="max-w-xl mx-auto space-y-3 bg-[#0f172a] p-2 rounded-xl">
                    <div className="flex items-center gap-2 mb-6">
                        <Calendar className="text-blue-400" size={24} />
                        <h2 className="text-xl font-bold text-slate-200">Mana Events</h2>
                    </div>
                    {MANA_EVENTS.map(ev => (
                        <div key={ev.id} className="p-4 sm:p-5 rounded-xl border border-blue-500/30 bg-blue-500/10 flex items-center justify-between transition-colors">
                            <span className="font-bold text-lg text-blue-400">{ev.name[lang]}</span>
                            <div className="flex flex-col text-right">
                                <span className="text-[10px] uppercase font-bold text-slate-500 opacity-80">{ev.note[lang]}</span>
                                <div className="flex items-center justify-end gap-1 mt-1 text-slate-200">
                                    <Zap size={14} className="text-blue-400" />
                                    <span className="font-mono font-bold text-lg">{ev.mana}</span>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const ManaAppContainer = () => {
            const [activeView, setActiveView] = useState('table');
            const [selectedLvl, setSelectedLvl] = useState(1);
            const [lang, setLang] = useState('en');
            const [isSnapping, setIsSnapping] = useState(false);
            
            const captureRef = useRef(null);

            const cycleLang = () => {
                setLang(prev => prev === 'en' ? 'pt' : prev === 'pt' ? 'es' : 'en');
            };

            const handleScreenshot = async () => {
                if (!captureRef.current) return;
                setIsSnapping(true);
                try {
                    const canvas = await html2canvas(captureRef.current, {
                        backgroundColor: '#0f172a',
                        scale: 2,
                        logging: false,
                        ignoreElements: (element) => element.classList.contains('hide-on-screenshot')
                    });
                    
                    exportScreenshot(canvas, `lords-mana-${activeView}.png`, `Lords Mana - ${activeView}`, `Mana details for ${activeView}.`, setIsSnapping);
                } catch (error) { setIsSnapping(false); }
            };

            const ActionIcon = (isMobileDevice() && navigator.share && navigator.canShare) ? Share2 : Copy;

            return (
                <div className="flex flex-col flex-1 overflow-hidden">
                    <div className="p-4 bg-[#1e293b] border-b border-slate-700 flex flex-col xl:flex-row gap-4 justify-between items-start xl:items-center shrink-0">
                        
                        <div className="flex items-center gap-3 w-full xl:w-auto">
                            <div className="relative flex-1 sm:flex-none sm:w-32">
                                <select 
                                    value={selectedLvl} 
                                    onChange={e => setSelectedLvl(Number(e.target.value))}
                                    className="w-full appearance-none bg-[#0f172a] border border-slate-600 text-slate-200 text-sm rounded-lg py-2 pl-3 pr-8 focus:outline-none focus:border-indigo-500 font-bold"
                                >
                                    {[1,2,3,4,5,6].map(l => <option key={l} value={l}>Lvl {l}</option>)}
                                </select>
                                <ChevronDown size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                            </div>

                            <button 
                                onClick={cycleLang}
                                className="flex items-center justify-center gap-2 bg-[#0f172a] border border-slate-600 text-slate-200 py-2 px-3 rounded-lg hover:border-slate-500 transition-colors shrink-0"
                                title="Change Language"
                            >
                                <Globe size={16} className="text-indigo-400"/>
                                <span className="text-sm font-bold uppercase w-5 text-center">{lang}</span>
                            </button>

                            <button
                                onClick={handleScreenshot}
                                className={`flex items-center justify-center gap-2 bg-[#0f172a] border border-slate-600 text-slate-200 py-2 px-3 rounded-lg transition-colors shrink-0 ${isSnapping === 'done' ? 'border-green-500 text-green-400' : isSnapping ? 'border-indigo-500 text-indigo-400 animate-pulse' : 'hover:border-slate-500'}`}
                                title="Share / Copy View"
                                disabled={!!isSnapping}
                            >
                                {isSnapping === 'done' ? <Check size={16} className="text-green-500"/> : <ActionIcon size={16} className={isSnapping ? "text-indigo-400" : "text-slate-400"} />}
                            </button>
                        </div>

                        <div className="flex bg-[#0f172a] p-1 rounded-lg border border-slate-700 w-full xl:w-auto overflow-x-auto no-scrollbar snap-x scroll-smooth">
                             <button onClick={() => setActiveView('table')} className={`shrink-0 snap-start flex-1 flex justify-center items-center gap-2 px-3 py-1.5 rounded-md text-sm font-bold transition-all ${activeView === 'table' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                <Table size={14}/> Table
                            </button>
                            <button onClick={() => setActiveView('troops')} className={`shrink-0 snap-start flex-1 flex justify-center items-center gap-2 px-3 py-1.5 rounded-md text-sm font-bold transition-all ${activeView === 'troops' ? 'bg-rose-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                <Sword size={14}/> Troops
                            </button>
                            <button onClick={() => setActiveView('store')} className={`shrink-0 snap-start flex-1 flex justify-center items-center gap-2 px-3 py-1.5 rounded-md text-sm font-bold transition-all ${activeView === 'store' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                <ShoppingCart size={14}/> Store
                            </button>
                            <button onClick={() => setActiveView('events')} className={`shrink-0 snap-start flex-1 flex justify-center items-center gap-2 px-3 py-1.5 rounded-md text-sm font-bold transition-all ${activeView === 'events' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                <Calendar size={14}/> Events
                            </button>
                        </div>

                    </div>

                    <div className="flex-1 overflow-y-auto bg-[#0f172a]">
                        {activeView === 'table' && <ManaTableView lvl={selectedLvl} lang={lang} captureRef={captureRef} />}
                        {activeView === 'troops' && <ManaTroopsView lvl={selectedLvl} lang={lang} captureRef={captureRef} />}
                        {activeView === 'store' && <ManaStoreView captureRef={captureRef} />}
                        {activeView === 'events' && <ManaEventsView lang={lang} captureRef={captureRef} />}
                    </div>
                </div>
            );
        }

        const AssistantTab = () => {
            const [activeSubTab, setActiveSubTab] = useState('titles');

            return (
                <div className="bg-[#1e293b] rounded-xl border border-slate-600 shadow-2xl overflow-hidden flex flex-col h-[700px]">
                    <div className="bg-[#1e293b] pt-6 px-6 border-b border-slate-700 shrink-0">
                        <h1 className="text-2xl font-bold text-indigo-400 mb-2">Assistant Tool</h1>
                        
                        <div className="flex space-x-4 sm:space-x-6 overflow-x-auto no-scrollbar scroll-smooth snap-x">
                            <button onClick={() => setActiveSubTab('titles')} className={`pb-3 text-sm font-bold flex items-center gap-2 transition-colors border-b-2 whitespace-nowrap snap-start shrink-0 ${activeSubTab === 'titles' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>
                                <Crown size={16}/> Base Titles
                            </button>
                            <button onClick={() => setActiveSubTab('gftasks')} className={`pb-3 text-sm font-bold flex items-center gap-2 transition-colors border-b-2 whitespace-nowrap snap-start shrink-0 ${activeSubTab === 'gftasks' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>
                                <Target size={16}/> GF Tasks
                            </button>
                            <button onClick={() => setActiveSubTab('mana')} className={`pb-3 pr-4 sm:pr-0 text-sm font-bold flex items-center gap-2 transition-colors border-b-2 whitespace-nowrap snap-start shrink-0 ${activeSubTab === 'mana' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>
                                <Zap size={16}/> Mana
                            </button>
                            {/* Funcionalidades Ocultas (Feature Toggle via Comentário)
                            <button onClick={() => setActiveSubTab('rss')} className={`pb-3 text-sm font-bold flex items-center gap-2 transition-colors border-b-2 whitespace-nowrap snap-start shrink-0 ${activeSubTab === 'rss' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>
                                <Calculator size={16}/> RSS Generator
                            </button>
                            <button onClick={() => setActiveSubTab('commands')} className={`pb-3 pr-4 sm:pr-0 text-sm font-bold flex items-center gap-2 transition-colors border-b-2 whitespace-nowrap snap-start shrink-0 ${activeSubTab === 'commands' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>
                                <ListIcon size={16}/> Bot Commands
                            </button>
                            */}
                        </div>
                    </div>

                    {activeSubTab === 'titles' && <BaseTitlesView />}
                    {activeSubTab === 'gftasks' && <GfTasksView />}
                    {activeSubTab === 'mana' && <ManaAppContainer />}
                    {/* {activeSubTab === 'rss' && <RssGeneratorView />}
                    {activeSubTab === 'commands' && <BotCommandsView />}
                    */}
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('comps');

            return (
                <div className="min-h-screen bg-[#0f172a] text-slate-200 font-sans p-2 sm:p-4 md:p-8 flex justify-center">
                    <div className="w-full max-w-4xl flex flex-col gap-4">
                        <div className="flex space-x-2 bg-[#1e293b] p-1 rounded-lg w-fit border border-slate-600 self-center md:self-start mb-2">
                            <button onClick={() => setActiveTab('comps')} className={`px-6 py-2 rounded-md text-sm font-bold transition-all ${activeTab === 'comps' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'}`}>
                                Comps
                            </button>
                            <button onClick={() => setActiveTab('assistant')} className={`px-6 py-2 rounded-md text-sm font-bold transition-all ${activeTab === 'assistant' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'}`}>
                                Assistant
                            </button>
                        </div>
                        <div className="transition-all duration-300">
                            {activeTab === 'comps' ? <CompsTab /> : <AssistantTab />}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
